name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          echo "=== Checking JavaScript syntax ==="
          for f in src/**/*.js; do
            node --check "$f" && echo "✓ $f" || echo "✗ $f"
          done

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          # Copy src/ into public/ so ES modules are accessible
          cp -r src public/src
          # Fix import paths in index.html: ../src/ -> ./src/
          sed -i "s|from '../src/|from './src/|g" public/index.html
          sed -i "s|import { initApp } from '../src/|import { initApp } from './src/|g" public/index.html
          # Fix Worker paths in app.js for GitHub Pages
          # Deployed: public/src/ui/app.js → needs public/worker.js (same as root /worker.js)
          # Relative: from src/ui/app.js, ../../ goes to root, so: ../../worker.js
          sed -i "s|../../public/worker.js|../../worker.js|g" public/src/ui/app.js
          echo "=== Deploy directory contents ==="
          ls -la public/ && ls -la public/src/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
